name: MSBuild CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  ARTIFACT_DIR: artifact-staging

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      working-directory: ${{env.SOLUTION_FILE_PATH}}
      run: nuget restore FileLockAnalyzer.sln

    - name: Build ${{ matrix.configuration }} ${{ matrix.platform }}
      working-directory: ${{env.SOLUTION_FILE_PATH}}
      shell: pwsh
      run: |
        $artifactDir = Join-Path (Resolve-Path .) $env:ARTIFACT_DIR
        $outDir = Join-Path $artifactDir "${{ matrix.configuration }}_${{ matrix.platform }}"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $msbuildArgs = @(
          "FileLockAnalyzer.sln",
          "/t:Restore;Build",
          "/p:Configuration=`"${{ matrix.configuration }}`"",
          "/p:Platform=`"${{ matrix.platform }}`"",
          "/p:PreferredToolArchitecture=x64",
          "/p:PlatformToolset=v143",
          "/p:WindowsTargetPlatformVersion=10.0",
          "/p:OutDir=`"$($outDir.TrimEnd('\'))\`"",
          "/p:IntermediateOutputPath=`"$(Join-Path $artifactDir 'obj' "${{ matrix.configuration }}_${{ matrix.platform }}")\`"",
          "/m",
          "/nologo",
          "/verbosity:minimal",
          "/p:DeployOnBuild=false",
          "/p:PackageAsSingleFile=false",
          "/p:SkipInvalidConfigurations=true",
          "/p:TrackFileAccess=false",
          "/p:BuildInParallel=true",
          "/p:UseOfMfc=Dynamic",
          "/p:CharacterSet=Unicode",
          "/consoleloggerparameters:Summary;ErrorsOnly;WarningsOnly"
        )
        Write-Host "Executing: msbuild $($msbuildArgs -join ' ')"
        & msbuild @msbuildArgs
        if ($LASTEXITCODE -ne 0) {
          Write-Host "##[error]MSBuild failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

        Write-Host "=== Build outputs in $outDir ==="
        Get-ChildItem -Path $outDir -File | ForEach-Object {
          Write-Host "  $($_.Name)  $([math]::Round($_.Length / 1KB, 2)) KB"
        }
        $exes = Get-ChildItem -Path $outDir -Filter *.exe
        if (-not $exes) {
          Write-Host "##[warning]No .exe found in output directory. Dumping full tree:"
          Get-ChildItem -Recurse $artifactDir -Depth 4 | Select-Object FullName,Length | Out-Host
        }

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FileLockAnalyzer_${{ matrix.configuration }}_${{ matrix.platform }}
        path: |
          ${{ env.ARTIFACT_DIR }}/${{ matrix.configuration }}_${{ matrix.platform }}/*.exe
          ${{ env.ARTIFACT_DIR }}/${{ matrix.configuration }}_${{ matrix.platform }}/*.dll
          ${{ env.ARTIFACT_DIR }}/${{ matrix.configuration }}_${{ matrix.platform }}/*.pdb
        retention-days: 30
        if-no-files-found: error
