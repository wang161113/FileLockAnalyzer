name: MSBuild CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.configuration }}, ${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild (VS 2022 / v143)
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
        vs-prerelease: false

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0

    - name: Restore solution packages
      working-directory: .
      run: nuget restore FileLockAnalyzer.sln -NonInteractive -Verbosity quiet

    - name: Build project
      id: build
      working-directory: .
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $arch       = if ("${{ matrix.platform }}" -eq "x64")   { "x64" }   else { "Win32" }
        $platDir    = if ("${{ matrix.platform }}" -eq "x64")   { "x64" }   else { "x86" }
        $config     = "${{ matrix.configuration }}"

        $repoRoot   = (Resolve-Path .).Path.TrimEnd('\')

        # ---------- MSBuild command line matches Run #2 success exactly: no OutDir/IntDir override, no binlog, no fancy filters ----------
        $cmd = @(
          "& msbuild FileLockAnalyzer.sln /t:Build"
          " /p:Configuration=`"$config`""
          " /p:Platform=`"$arch`""
          " /p:PlatformToolset=v143 /p:PreferredToolArchitecture=x64 /p:WindowsTargetPlatformVersion=10.0"
          " /p:UseOfMfc=Dynamic /p:CharacterSet=Unicode"
          " /p:BuildInParallel=true /p:TrackFileAccess=false /p:SkipInvalidConfigurations=true"
          " /maxcpucount /nologo /verbosity:normal"
        ) -join ""

        Write-Host "::group::MSBuild invokation"
        Write-Host  $cmd
        Write-Host "::endgroup::"

        $stdout = iex $cmd 2>&1 | Out-String
        $exitCode = $LASTEXITCODE

        # ---------- Diagnose: scan stdout for error patterns, print summary + last 40 lines on failure ----------
        Write-Host "::group::Build result"
        Write-Host  "Exit code    : $exitCode"
        if ($exitCode -ne 0) {
          $lines = ($stdout -split "`r?`n")
          $matches = @()
          foreach ($l in $lines) {
            if ($l -match '(?i)\b(error\s*[A-Z]{2,}\d+|: error )') { $matches += $l }
          }
          Write-Host  "------ error lines ($($matches.Count)) ------"
          $n = 0
          foreach ($m in $matches) { Write-Host "  ERR> $m"; $n++; if ($n -ge 40) { break } }
          Write-Host  "------ tail 40 ------"
          $start = [Math]::Max(0, $lines.Count - 40)
          for ($i = $start; $i -lt $lines.Count; $i++) { Write-Host ("  L{0,-4} {1}" -f ($i+1), $lines[$i]) }
        } else {
          $lines = ($stdout -split "`r?`n")
          Write-Host  "Build summary : $($lines.Count) lines"
        }

        # ---------- Find final EXE (vcxproj default: $(Platform)\$(Configuration)\) ----------
        $exe = $null
        $candidates = @(
          "$repoRoot\x64\$config\FileLockAnalyzer.exe",
          "$repoRoot\$platDir\$config\FileLockAnalyzer.exe",
          "$repoRoot\$arch\$config\FileLockAnalyzer.exe",
          "$repoRoot\Debug\FileLockAnalyzer.exe",
          "$repoRoot\Release\FileLockAnalyzer.exe"
        )
        foreach ($c in $candidates) {
          if ([System.IO.File]::Exists($c)) { $exe = $c; break }
        }
        if (-not $exe) {
          $all = [System.IO.Directory]::GetFiles($repoRoot, "FileLockAnalyzer.exe", [System.IO.SearchOption]::AllDirectories)
          foreach ($c in $all) { if ($c -notmatch '\\obj\\') { $exe = $c; break } }
        }
        if ($exe) {
          $fi = [System.IO.FileInfo]$exe
          Write-Host  "Target EXE   : $($fi.FullName)"
          Write-Host  "EXE size     : $([math]::Round($fi.Length / 1KB, 2)) KB"
        } else {
          Write-Host  "Target EXE   : (not found)"
          # Print top-level dirs for debugging
          foreach ($d in [System.IO.Directory]::GetDirectories($repoRoot)) {
            $dn = [System.IO.Path]::GetFileName($d.TrimEnd('\'))
            Write-Host "  [repo dir] $dn"
          }
        }
        Write-Host "::endgroup::"

        # ---------- Export via GITHUB_OUTPUT / GITHUB_ENV ----------
        $OUTDIR_FOUND = if ($exe) { [System.IO.Path]::GetDirectoryName($exe) } else { '' }
        "OUTDIR_FOUND=$OUTDIR_FOUND" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        if ($exitCode -ne 0) {
          Write-Host "::error::MSBuild exited with code $exitCode"
          exit $exitCode
        }
        if (-not $exe) {
          Write-Host "::error::MSBuild exited 0 but FileLockAnalyzer.exe was not produced."
          exit 1
        }

    - name: Stage artifacts
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $repoRoot = (Resolve-Path .).Path.TrimEnd('\')
        $src      = $env:OUTDIR_FOUND
        $staging  = "$repoRoot\_publish\${{ matrix.configuration }}_${{ matrix.platform }}"
        $null     = New-Item -ItemType Directory -Force -Path $staging
        $seen     = @{}
        if ([string]::IsNullOrWhiteSpace($src) -or -not (Test-Path -LiteralPath $src)) {
          Write-Host "::warning::OUTDIR_FOUND empty. Nothing to stage."
          exit 0
        }
        foreach ($pattern in @("*.exe","*.dll","*.pdb")) {
          foreach ($f in [System.IO.Directory]::GetFiles($src, $pattern)) {
            $name = [System.IO.Path]::GetFileName($f)
            if ($seen.ContainsKey($name)) { continue }
            $dest = Join-Path $staging $name
            [System.IO.File]::Copy($f, $dest, $true)
            $size = [math]::Round(([System.IO.FileInfo]$f).Length / 1KB, 2)
            Write-Host "  $name  $size KB"
            $seen[$name] = $true
          }
        }
        if ($seen.Count -eq 0) { Write-Host "  (no files staged)" }

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FileLockAnalyzer_${{ matrix.configuration }}_${{ matrix.platform }}
        path: _publish/${{ matrix.configuration }}_${{ matrix.platform }}/
        retention-days: 30
        compression-level: 6
        if-no-files-found: warn
