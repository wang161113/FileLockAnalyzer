name: MSBuild CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      working-directory: ${{env.SOLUTION_FILE_PATH}}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        nuget restore FileLockAnalyzer.sln
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::nuget restore failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

    - name: Build ${{ matrix.configuration }} ${{ matrix.platform }}
      working-directory: ${{env.SOLUTION_FILE_PATH}}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $msbuildArgs = @(
          "FileLockAnalyzer.sln",
          "/p:Configuration=`"${{ matrix.configuration }}`"",
          "/p:Platform=`"${{ matrix.platform }}`"",
          "/p:PreferredToolArchitecture=x64",
          "/p:PlatformToolset=v143",
          "/p:WindowsTargetPlatformVersion=10.0",
          "/m",
          "/nologo",
          "/verbosity:minimal",
          "/p:DeployOnBuild=false",
          "/p:PackageAsSingleFile=false",
          "/p:SkipInvalidConfigurations=true",
          "/p:TrackFileAccess=false",
          "/p:BuildInParallel=true",
          "/p:UseOfMfc=Dynamic",
          "/p:CharacterSet=Unicode",
          "/consoleloggerparameters:Summary;ErrorsOnly"
        )
        $cmdLine = "msbuild " + ($msbuildArgs -join ' ')
        Write-Host "::debug::MSBuild command: $cmdLine"
        & msbuild @msbuildArgs
        $msbuildExit = $LASTEXITCODE

        $root = Resolve-Path .
        $platformDirs = if ("${{ matrix.platform }}" -eq "Win32") { @("x86", "Win32") } else { @("x64") }
        $foundDirs = @()
        foreach ($pd in $platformDirs) {
          $candidate = Join-Path $root $pd "${{ matrix.configuration }}"
          if (Test-Path -LiteralPath $candidate) {
            $exes = [System.IO.Directory]::GetFiles($candidate, "*.exe")
            if ($exes.Count -gt 0) { $foundDirs += $candidate }
          }
        }
        if ($foundDirs.Count -eq 0) {
          $allExes = [System.IO.Directory]::GetFiles("$root", "FileLockAnalyzer.exe", [System.IO.SearchOption]::AllDirectories)
          foreach ($e in $allExes) {
            if ($e -notmatch [regex]::Escape('\obj\')) {
              $d = [System.IO.Path]::GetDirectoryName($e)
              if ($foundDirs -notcontains $d) { $foundDirs += $d }
            }
          }
        }
        if ($foundDirs.Count -eq 0) {
          Write-Host "::warning::No FileLockAnalyzer.exe found anywhere. Listing top-level directories for diagnosis:"
          foreach ($d in [System.IO.Directory]::GetDirectories("$root")) {
            $name = [System.IO.Path]::GetFileName($d.TrimEnd('\'))
            Write-Host "  D  $name"
          }
        }

        $OUTPUT_DIRS = if ($foundDirs.Count) { $foundDirs -join '|' } else { '' }
        Add-Content -Path $env:GITHUB_ENV -Value "OUTPUT_DIRS=$OUTPUT_DIRS" -Encoding utf8
        Write-Host "::notice::OUTPUT_DIRS=$OUTPUT_DIRS"

        if ($msbuildExit -ne 0) {
          Write-Host "::error::MSBuild failed with exit code $msbuildExit"
          exit $msbuildExit
        }
        if ($foundDirs.Count -eq 0) {
          Write-Host "::error::MSBuild reported success but no .exe was produced."
          exit 1
        }

    - name: Prepare build artifacts
      if: success()
      working-directory: ${{env.SOLUTION_FILE_PATH}}
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = Resolve-Path .
        $staging = Join-Path $root "_staging" "${{ matrix.configuration }}_${{ matrix.platform }}"
        $null = New-Item -ItemType Directory -Force -Path $staging

        $dirs = if ($env:OUTPUT_DIRS) { $env:OUTPUT_DIRS -split '\|' } else { @() }
        $seen = @{}
        foreach ($dir in $dirs) {
          if (-not (Test-Path -LiteralPath $dir)) { continue }
          foreach ($ext in @("*.exe", "*.dll", "*.pdb")) {
            foreach ($file in [System.IO.Directory]::GetFiles($dir, $ext)) {
              $name = [System.IO.Path]::GetFileName($file)
              if (-not $seen.ContainsKey($name)) {
                $dest = Join-Path $staging $name
                [System.IO.File]::Copy($file, $dest, $true)
                $size = [math]::Round(([System.IO.FileInfo]$file).Length / 1KB, 2)
                Write-Host "  $name  $size KB"
                $seen[$name] = $true
              }
            }
          }
        }
        if ($seen.Count -eq 0) {
          Write-Host "::warning::No artifacts were copied to staging."
        }

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FileLockAnalyzer_${{ matrix.configuration }}_${{ matrix.platform }}
        path: _staging/${{ matrix.configuration }}_${{ matrix.platform }}/
        retention-days: 30
        if-no-files-found: warn
