name: MSBuild CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.configuration }}, ${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild (VS 2022 / v143)
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64
        vs-prerelease: false

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2.0.0

    - name: Restore solution packages
      working-directory: .
      run: nuget restore FileLockAnalyzer.sln -NonInteractive -Verbosity quiet

    - name: Build project
      id: build
      working-directory: .
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'

        $arch       = if ("${{ matrix.platform }}" -eq "x64")   { "x64" }   else { "Win32" }
        $platDir    = if ("${{ matrix.platform }}" -eq "x64")   { "x64" }   else { "x86" }
        $config     = "${{ matrix.configuration }}"

        $repoRoot   = (Resolve-Path .).Path.TrimEnd('\')
        $outDir     = "$repoRoot\bin\$platDir\$config\"
        $intDir     = "$repoRoot\obj\$platDir\$config\"

        New-Item -ItemType Directory -Force -Path $outDir | Out-Null
        New-Item -ItemType Directory -Force -Path $intDir | Out-Null

        $logDir     = "$repoRoot\_logs"
        $null = New-Item -ItemType Directory -Force -Path $logDir
        $binLog     = Join-Path $logDir "msbuild_$platDir_$config.binlog"
        $errLog     = Join-Path $logDir "msbuild_$platDir_$config.err.log"

        # ---------- MSBuild command line (matches Run #2 SUCCESS params, plus Explicit OutDir) ----------
        $msbuildArgs = @(
          "FileLockAnalyzer.sln",
          "/t:Build",
          "/p:Configuration=`"$config`"",
          "/p:Platform=`"$arch`"",
          "/p:PlatformToolset=v143",
          "/p:PreferredToolArchitecture=x64",
          "/p:WindowsTargetPlatformVersion=10.0",
          "/p:OutDir=`"$outDir`"",
          "/p:IntDir=`"$intDir`"",
          "/p:UseOfMfc=Dynamic",
          "/p:CharacterSet=Unicode",
          "/p:BuildInParallel=true",
          "/p:TrackFileAccess=false",
          "/p:SkipInvalidConfigurations=true",
          "/maxcpucount",
          "/nologo",
          "/verbosity:normal",
          "/bl:`"$binLog`"",
          "/err:`"$errLog`"",
          "/fileloggerparameters:Verbosity=diagnostic;LogFile=`"$(Join-Path $logDir "msbuild_$platDir_$config.diag.log")`""
        )

        Write-Host "::group::MSBuild invokation"
        Write-Host  "msbuild $($msbuildArgs -join ' ')"
        Write-Host "::endgroup::"

        & msbuild @msbuildArgs
        $exitCode = $LASTEXITCODE

        # ---------- Diagnose: dump error log tail + top 20 cl/link error lines from diag log ----------
        Write-Host "::group::Build result"
        Write-Host  "Exit code    : $exitCode"
        Write-Host  "OutDir       : $outDir"
        Write-Host  "IntDir       : $intDir"
        Write-Host  "BinLog       : $binLog"
        Write-Host  "ErrLog       : $errLog"
        if ($exitCode -ne 0) {
          Write-Host  "------ stderr (tail) ------"
          if (Test-Path -LiteralPath $errLog) {
            [string[]]$lines = [System.IO.File]::ReadAllLines($errLog)
            $start = [Math]::Max(0, $lines.Count - 50)
            for ($i = $start; $i -lt $lines.Count; $i++) { Write-Host ("  {0}" -f $lines[$i]) }
          } else { Write-Host "  (no error log file)" }
          Write-Host  "------ MSBuild stdout errors (search) ------"
          if (Test-Path -LiteralPath $logDir) {
            foreach ($f in [System.IO.Directory]::GetFiles($logDir, "*.log")) {
              [string[]]$all = [System.IO.File]::ReadAllLines($f)
              $n = 0
              foreach ($l in $all) {
                if ($l -match '(?i)error\s*[A-Z]{2,}\d+' -or $l -match '(?i): error ') {
                  Write-Host ("  ERR> {0}" -f $l)
                  $n++
                  if ($n -ge 30) { break }
                }
              }
              if ($n -gt 0) { break }
            }
          }
        }

        # ---------- Find final EXE ----------
        $exe = $null
        if (Test-Path -LiteralPath $outDir) {
          $candidates = [System.IO.Directory]::GetFiles($outDir, "*.exe")
          if ($candidates -and $candidates.Count -gt 0) { $exe = $candidates[0] }
        }
        if (-not $exe) {
          Write-Host "  [warn] EXE not in explicit OutDir. Falling back to recursive search..."
          $all = [System.IO.Directory]::GetFiles($repoRoot, "FileLockAnalyzer.exe", [System.IO.SearchOption]::AllDirectories)
          foreach ($c in $all) {
            if ($c -notmatch '\\obj\\') { $exe = $c; break }
          }
        }
        if ($exe) {
          $fi = [System.IO.FileInfo]$exe
          Write-Host  "Target EXE   : $($fi.FullName)"
          Write-Host  "EXE size     : $([math]::Round($fi.Length / 1KB, 2)) KB"
        } else {
          Write-Host  "Target EXE   : (not found)"
          # Print top-level dirs for debugging
          foreach ($d in [System.IO.Directory]::GetDirectories($repoRoot)) {
            $dn = [System.IO.Path]::GetFileName($d.TrimEnd('\'))
            Write-Host "  [repo dir] $dn"
          }
        }
        Write-Host "::endgroup::"

        # ---------- Export via GITHUB_OUTPUT / GITHUB_ENV ----------
        $OUTDIR_FOUND = if ($exe) { [System.IO.Path]::GetDirectoryName($exe) } else { '' }
        "OUTDIR_FOUND=$OUTDIR_FOUND" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        if ($exitCode -ne 0) {
          "MSBUILD_FAILED=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "::error::MSBuild exited with code $exitCode"
        }
        if (-not $exe -and $exitCode -eq 0) {
          Write-Host "::error::MSBuild exited 0 but FileLockAnalyzer.exe was not produced."
          exit 1
        }

    - name: Upload MSBuild diagnostic logs (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: msbuild-diagnostics-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          _logs/
        compression-level: 6
        retention-days: 7
        if-no-files-found: ignore

    - name: Stage artifacts
      if: success() && env.MSBUILD_FAILED != '1'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $repoRoot = (Resolve-Path .).Path.TrimEnd('\')
        $src      = $env:OUTDIR_FOUND
        $staging  = "$repoRoot\_publish\${{ matrix.configuration }}_${{ matrix.platform }}"
        $null     = New-Item -ItemType Directory -Force -Path $staging
        $seen     = @{}
        if ([string]::IsNullOrWhiteSpace($src) -or -not (Test-Path -LiteralPath $src)) {
          Write-Host "::warning::OUTDIR_FOUND empty. Nothing to stage."
          exit 0
        }
        foreach ($pattern in @("*.exe","*.dll","*.pdb")) {
          foreach ($f in [System.IO.Directory]::GetFiles($src, $pattern)) {
            $name = [System.IO.Path]::GetFileName($f)
            if ($seen.ContainsKey($name)) { continue }
            $dest = Join-Path $staging $name
            [System.IO.File]::Copy($f, $dest, $true)
            $size = [math]::Round(([System.IO.FileInfo]$f).Length / 1KB, 2)
            Write-Host "  $name  $size KB"
            $seen[$name] = $true
          }
        }
        if ($seen.Count -eq 0) { Write-Host "  (no files staged)" }

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FileLockAnalyzer_${{ matrix.configuration }}_${{ matrix.platform }}
        path: _publish/${{ matrix.configuration }}_${{ matrix.platform }}/
        retention-days: 30
        compression-level: 6
        if-no-files-found: warn
