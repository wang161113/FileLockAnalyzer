name: MSBuild CI

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: ["main", "master"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.configuration }}, ${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure MFC build tools are installed
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $installer = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\setup.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $installPath) {
            throw "Visual Studio installation not found."
          }

          $msvcRoot = Join-Path $installPath "VC\Tools\MSVC"
          $toolsetDir = Get-ChildItem $msvcRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $toolsetDir) {
            throw "MSVC toolset directory not found under $msvcRoot."
          }

          $mfcX86 = Join-Path $toolsetDir.FullName "atlmfc\lib\x86\mfc140u.lib"
          $mfcX64 = Join-Path $toolsetDir.FullName "atlmfc\lib\x64\mfc140u.lib"
          if ((Test-Path $mfcX86) -and (Test-Path $mfcX64)) {
            Write-Host "MFC libraries already present."
            exit 0
          }

          Write-Host "MFC libraries missing. Installing Microsoft.VisualStudio.Component.VC.ATLMFC..."
          & $installer modify --installPath $installPath --add Microsoft.VisualStudio.Component.VC.ATLMFC --passive --norestart --wait
          if ($LASTEXITCODE -ne 0) {
            throw "Visual Studio installer exited with code $LASTEXITCODE."
          }

          if (-not ((Test-Path $mfcX86) -and (Test-Path $mfcX64))) {
            throw "MFC libraries are still missing after installation."
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore solution packages
        shell: cmd
        run: nuget restore FileLockAnalyzer.sln -NonInteractive -Verbosity quiet

      - name: Build solution
        shell: cmd
        run: if not exist _logs mkdir _logs && msbuild FileLockAnalyzer.sln /m /nologo /clp:ErrorsOnly;Summary /fileLogger /fileLoggerParameters:LogFile=_logs\msbuild_${{ matrix.configuration }}_${{ matrix.platform }}.log;Verbosity=diagnostic /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 /p:PreferredToolArchitecture=x64 /p:WindowsTargetPlatformVersion=10.0 /p:UseOfMfc=Dynamic /p:CharacterSet=Unicode

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs_${{ matrix.configuration }}_${{ matrix.platform }}
          path: _logs/*.log
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FileLockAnalyzer_${{ matrix.configuration }}_${{ matrix.platform }}
          path: |
            x64/${{ matrix.configuration }}/FileLockAnalyzer.exe
            x64/${{ matrix.configuration }}/*.dll
            x64/${{ matrix.configuration }}/*.pdb
            Win32/${{ matrix.configuration }}/FileLockAnalyzer.exe
            Win32/${{ matrix.configuration }}/*.dll
            Win32/${{ matrix.configuration }}/*.pdb
            x86/${{ matrix.configuration }}/FileLockAnalyzer.exe
            x86/${{ matrix.configuration }}/*.dll
            x86/${{ matrix.configuration }}/*.pdb
            ${{ matrix.configuration }}/FileLockAnalyzer.exe
            ${{ matrix.configuration }}/*.dll
            ${{ matrix.configuration }}/*.pdb
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: FileLockAnalyzer_Release_*
          path: release_assets

      - name: Package release assets
        shell: pwsh
        run: |
          $assetRoot = Join-Path $PWD "release_assets"
          $zipRoot = Join-Path $PWD "_release_zips"
          $stageRoot = Join-Path $PWD "_release_stage"
          New-Item -ItemType Directory -Force -Path $zipRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $stageRoot | Out-Null

          $artifactDirs = Get-ChildItem $assetRoot -Directory | Where-Object { $_.Name -like "FileLockAnalyzer_Release_*" }
          if (-not $artifactDirs) {
            throw "No release build artifacts found for release packaging."
          }

          foreach ($dir in $artifactDirs) {
            $stageDir = Join-Path $stageRoot $dir.Name
            New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

            $releaseFiles = Get-ChildItem $dir.FullName -Recurse -File | Where-Object {
              $_.Extension -in @(".exe", ".dll")
            }
            if (-not $releaseFiles) {
              throw "No exe/dll files found in $($dir.Name)."
            }

            foreach ($file in $releaseFiles) {
              Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $stageDir $file.Name) -Force
            }

            $zipPath = Join-Path $zipRoot ($dir.Name + ".zip")
            Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath -Force
          }

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: _release_zips/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
