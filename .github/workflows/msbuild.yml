name: MSBuild CI

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [Win32, x64]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      working-directory: ${{env.SOLUTION_FILE_PATH}}
      run: nuget restore FileLockAnalyzer.sln

    - name: Build ${{ matrix.configuration }} ${{ matrix.platform }}
      working-directory: ${{env.SOLUTION_FILE_PATH}}
      shell: pwsh
      run: |
        $msbuildArgs = @(
          "FileLockAnalyzer.sln",
          "/t:Build",
          "/p:Configuration=`"${{ matrix.configuration }}`"",
          "/p:Platform=`"${{ matrix.platform }}`"",
          "/p:PreferredToolArchitecture=x64",
          "/p:PlatformToolset=v143",
          "/p:WindowsTargetPlatformVersion=10.0",
          "/m",
          "/nologo",
          "/verbosity:minimal",
          "/p:DeployOnBuild=false",
          "/p:PackageAsSingleFile=false",
          "/p:SkipInvalidConfigurations=true",
          "/p:TrackFileAccess=false",
          "/p:BuildInParallel=true",
          "/p:UseOfMfc=Dynamic",
          "/p:CharacterSet=Unicode",
          "/consoleloggerparameters:Summary;ErrorsOnly;WarningsOnly"
        )
        Write-Host "::group::MSBuild command line"
        Write-Host "msbuild $($msbuildArgs -join ' ')"
        Write-Host "::endgroup::"
        & msbuild @msbuildArgs
        $exitCode = $LASTEXITCODE
        if ($exitCode -ne 0) {
          Write-Host "::error::MSBuild failed with exit code $exitCode"
          exit $exitCode
        }

        $platformDir = if ("${{ matrix.platform }}" -eq "Win32") { "x86", "Win32" } else { "x64" }
        $found = @()
        foreach ($p in $platformDir) {
          $candidate = Join-Path (Resolve-Path .) $p "${{ matrix.configuration }}"
          if (Test-Path $candidate) {
            $exes = Get-ChildItem -Path $candidate -Filter *.exe
            if ($exes) { $found += $candidate }
          }
        }
        if (-not $found) {
          Write-Host "::warning::Standard output dirs not found. Searching entire repo for FileLockAnalyzer.exe..."
          $exes = Get-ChildItem -Path (Resolve-Path .) -Filter FileLockAnalyzer.exe -Recurse -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notmatch '\\obj\\' }
          if ($exes) { $found += $exes[0].DirectoryName }
        }
        Write-Host "::group::Detected output directories"
        foreach ($d in $found) { Write-Host "  - $d" }
        Write-Host "::endgroup::"
        $env:OUTPUT_DIRS = $found -join '|'
        "OUTPUT_DIRS=$($env:OUTPUT_DIRS)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

        if (-not $found) {
          Write-Host "::error::No output directory with FileLockAnalyzer.exe found. Build may have produced no artifacts."
          exit 1
        }

    - name: Prepare build artifacts
      if: success()
      shell: pwsh
      run: |
        $staging = Join-Path (Resolve-Path .) "_staging" "${{ matrix.configuration }}_${{ matrix.platform }}"
        New-Item -ItemType Directory -Force -Path $staging | Out-Null

        $dirs = $env:OUTPUT_DIRS -split '\|' | Where-Object { $_ }
        foreach ($dir in $dirs) {
          Get-ChildItem -Path $dir -File -Include *.exe,*.dll,*.pdb |
            ForEach-Object {
              $dest = Join-Path $staging $_.Name
              if (-not (Test-Path $dest)) { Copy-Item $_.FullName -Destination $dest -Force }
            }
        }

        Write-Host "::group::Staged artifacts ($staging)"
        $items = Get-ChildItem -Path $staging -File | Sort-Object Name
        if (-not $items) {
          Write-Host "  (empty)"
        } else {
          foreach ($f in $items) {
            Write-Host "  $($f.Name)  $([math]::Round($_.Length / 1KB, 2)) KB"
          }
        }
        Write-Host "::endgroup::"

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: FileLockAnalyzer_${{ matrix.configuration }}_${{ matrix.platform }}
        path: _staging/${{ matrix.configuration }}_${{ matrix.platform }}/*
        retention-days: 30
        if-no-files-found: error
